packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@agentclientprotocol/sdk": ^1.6.0
  "@effect/opentelemetry": ^4.0.0
  "@oxlint/plugins": 1.85.0
  "@types/node": ^26.6.4
  "@types/picomatch": ^4.0.3
  "@types/validator": ^13.15.10
  avro-js: ^1.12.2
  chdb: ^3.4.0
  effect: ^4.0.0
  hyparquet: ^1.31.2
  hyparquet-writer: ^0.16.10
  picomatch: ^4.0.7
  typescript: ^7.0.2
  uuid: ^14.0.2
  validator: ^13.15.35
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
publicHoistPattern:
  - "*"
allowBuilds:
  chdb: true
  msgpackr-extract: true
