[project]
name = "open-insight-rl-slime"
version = "0.0.0"
description = "Slime integration for Open Insight reinforcement learning workflows."
readme = "README.md"
authors = [{ name = "Wang Bowei", email = "wozluohd@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.2"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "open_insight.rl_slime"
namespace = true
